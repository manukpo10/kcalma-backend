spring:
  application:
    name: kcalma-api
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
  flyway:
    schemas: app
    default-schema: app
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

app:
  timezone: ${APP_TIMEZONE:America/Argentina/Buenos_Aires}
  security:
    supabase-url: ${SUPABASE_URL}
    # Open registration: the API accepts any authenticated, non-anonymous Supabase user (see
    # SecurityConfig). This list is now the ADMIN allowlist (env name kept for compatibility) --
    # optional, only used to skip the global Gemini usage cap below.
    owner-user-ids: ${OWNER_USER_IDS:}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    base-url: https://generativelanguage.googleapis.com
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Keeps one user's own ceiling comfortably below app.global-rate-limit.per-minute below (10/min
    # shared by everyone) -- without this, one account's own burst window alone could consume the
    # whole app-wide per-minute cap and lock out every other user. Applies to admins too.
    per-minute-requests: ${GEMINI_USER_PER_MINUTE:4}
    window-requests: ${GEMINI_USER_PER_10MIN:20}
    window-minutes: ${RATE_LIMIT_WINDOW_MINUTES:10}
    # Lowered from a single-owner-era 150: with open registration, ~10 users must share one
    # project's free Gemini quota (~400/day total -- see app.global-rate-limit below).
    daily-requests: ${GEMINI_USER_PER_DAY:50}
  # Shared across every user, on top of each user's own app.rate-limit above -- protects the
  # whole app's free-tier Gemini quota now that sign-up is open. Admins (owner-user-ids) skip it.
  global-rate-limit:
    per-minute: ${GEMINI_GLOBAL_PER_MINUTE:10}
    # Set this to ~80% of the project's real requests-per-day quota shown in Google AI Studio
    # (Google's own free-tier default is ~500 RPD at the time of writing) -- headroom for quota
    # drift and other callers on the same project, not the raw quota number itself.
    per-day: ${GEMINI_GLOBAL_PER_DAY:400}
  push:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:https://kcalma-frontend.vercel.app}

# Sprint 3b smart reminders: the scheduler itself can be killed with one env var, independent of
# the /api/push/**  and /api/reminders endpoints (which always keep working) -- see
# com.kcalma.reminder.ReminderScheduler's javadoc for the two concrete reasons this exists.
kcalma:
  reminders:
    scheduler-enabled: ${REMINDERS_SCHEDULER_ENABLED:true}
    # How long past its exact minute a slot stays due -- see DueReminderEvaluator's javadoc. Covers
    # a restart or a slow tick without losing the occurrence for the rest of the day.
    catch-up-minutes: ${REMINDERS_CATCH_UP_MINUTES:10}

# Off by default (production on Render stays off) — SecurityConfig gates /v3/api-docs and
# /swagger-ui/** behind this same env var, so the docs' own registration and their exposure
# through the security filter chain can't drift out of sync.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
