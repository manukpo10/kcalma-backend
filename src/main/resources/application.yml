spring:
  application:
    name: kcalma-api
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
  flyway:
    schemas: app
    default-schema: app
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

app:
  security:
    supabase-url: ${SUPABASE_URL}
    owner-user-ids: ${OWNER_USER_IDS:}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    base-url: https://generativelanguage.googleapis.com

# Off by default (production on Render stays off) — SecurityConfig gates /v3/api-docs and
# /swagger-ui/** behind this same env var, so the docs' own registration and their exposure
# through the security filter chain can't drift out of sync.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
